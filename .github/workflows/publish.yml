name: Publish

# One-off: publishes the versions already released on next with NPM_ACCESS_TOKEN.
# Remove once every package is on npm and has a trusted publisher.
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24.22.1
                  cache: 'pnpm'
                  registry-url: 'https://registry.npmjs.org'
            - run: pnpm install --frozen-lockfile
            - run: pnpm nx run-many --target=build
            - run: pnpm nx release publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
